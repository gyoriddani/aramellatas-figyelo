name: Automatikus ellátásbiztonsági figyelés és e-mail
on:
  schedule:
    - cron: '17 */3 * * *' # kb. 3 óránként; Actions ütemezés csúszhat
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: supply-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Repo
        uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Nyilvános adatok lekérése
        env:
          GIE_API_KEY: ${{ secrets.GIE_API_KEY }}
          ENTSOE_API_TOKEN: ${{ secrets.ENTSOE_API_TOKEN }}
        run: python scripts/collect.py
      - name: 24 órás kategória-indexek számítása
        run: python scripts/assess.py
      - name: Figyelmeztető e-mail, ha index >=50/100 és van SMTP beállítás
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python scripts/notify.py
      - name: Adatpillanatkép és riasztási napló mentése
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json data/alert_state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Friss ellátásbiztonsági adatok és riasztásnapló'
            git pull --rebase origin main
            git push origin main
          fi
